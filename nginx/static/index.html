<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>temp-share | Anonymous File Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">
    <div class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
            <!-- Header -->
            <div class="p-8 text-center bg-white">
                <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">temp-share</h1>
                <p class="text-slate-500 mt-2 font-medium">Anonymous & Temporary File Hosting</p>
            </div>

            <div id="upload-container" class="p-8 pt-0 space-y-6">
                <!-- Dropzone -->
                <div id="dropzone" class="border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all duration-300 group">
                    <div class="space-y-4">
                        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto group-hover:bg-blue-100 transition-colors">
                            <i class="fas fa-cloud-upload-alt text-2xl text-blue-500"></i>
                        </div>
                        <div>
                            <p id="file-name" class="text-slate-700 font-bold text-lg">Select or drag file</p>
                            <p class="text-slate-400 text-sm mt-1">Maximum size: 500MB</p>
                        </div>
                    </div>
                    <input type="file" id="file-input" class="hidden">
                </div>

                <!-- Expiry -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Auto-delete after</label>
                    <select id="expiry-select" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium">
                        <option value="30">30 Minutes</option>
                        <option value="60">1 Hour</option>
                        <option value="120">2 Hours</option>
                        <option value="180">3 Hours</option>
                    </select>
                </div>

                <!-- Progress Bar (Hidden initially) -->
                <div id="progress-container" class="hidden space-y-2">
                    <div class="flex justify-between text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <span>Uploading...</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-blue-600 w-0 transition-all duration-300 progress-bar-animated"></div>
                    </div>
                </div>

                <!-- Upload Button -->
                <button id="upload-btn" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold text-lg shadow-xl shadow-slate-200 hover:bg-slate-800 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    Upload Now
                </button>
            </div>

            <!-- Result Section (Hidden initially) -->
            <div id="result-container" class="hidden p-8 space-y-6 animate-in fade-in zoom-in duration-500">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto">
                        <i class="fas fa-check text-2xl text-green-600"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Success!</h2>
                    <p class="text-slate-500">Your file is live and temporary.</p>
                </div>

                <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 relative group">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Share Link</p>
                    <p id="share-link" class="text-blue-600 font-mono text-sm break-all font-bold"></p>
                    <button id="copy-btn" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-white shadow-sm border border-slate-200 rounded-lg text-slate-400 hover:text-blue-500 transition-colors">
                        <i class="far fa-copy"></i>
                    </button>
                </div>

                <div class="flex justify-center p-2 bg-white rounded-xl border border-slate-100">
                    <img id="qr-code" src="" alt="QR Code" class="w-48 h-48">
                </div>

                <button onclick="window.location.reload()" class="w-full py-3 text-slate-500 font-bold hover:text-slate-800 transition-colors">
                    Upload Another
                </button>
            </div>
        </div>
        
        <p class="mt-8 text-slate-400 text-sm font-medium">
            Powered by <span class="text-slate-600">FastAPI</span> & <span class="text-slate-600">Azure</span>
        </p>
    </div>

    <script src="upload.js"></script>
</body>
</html>
